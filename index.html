<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panama Metro Roleplay — Dirección de Administración</title>
<style>
  :root{
    --navy-900:#132845;
    --navy-800:#1c3a5e;
    --navy-700:#25476f;
    --cream:#f5f1e6;
    --cream-2:#efe9db;
    --card:#fffdf9;
    --line:#e3dccb;
    --ink:#1c2430;
    --ink-soft:#5b6472;
    --gold:#b8935a;
    --danger:#9c3b3b;
    --ok:#2f6d4f;
    --radius:10px;
    font-size:16px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--cream);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    min-height:100vh;
  }
  h1,h2,h3,.serif{
    font-family:Georgia,"Iowan Old Style","Palatino Linotype",Palatino,serif;
  }
  a{color:inherit;}
  button{font-family:inherit;}

  #app{display:flex;flex-direction:column;min-height:100vh;}

  header.topbar{
    background:var(--navy-800);
    color:#fff;
    padding:16px 24px;
    display:flex;align-items:center;gap:14px;
    flex-shrink:0;
  }
  header.topbar .crest{
    width:38px;height:38px;border-radius:9px;
    background:rgba(255,255,255,.08);
    display:flex;align-items:center;justify-content:center;
    border:1px solid rgba(255,255,255,.18);
  }
  header.topbar h1{margin:0;font-size:17px;font-weight:700;letter-spacing:.2px;}
  header.topbar p{margin:1px 0 0;font-size:12px;color:#c7d2e0;font-family:inherit;}

  .shell{display:flex;flex:1;min-height:0;}

  nav.sidebar{
    width:230px;flex-shrink:0;
    background:var(--navy-900);
    padding:16px 10px;
    display:flex;flex-direction:column;gap:2px;
  }
  nav.sidebar button{
    all:unset;
    display:flex;align-items:center;gap:10px;
    padding:10px 12px;border-radius:8px;
    color:#d7deea;font-size:14px;cursor:pointer;
    transition:background .12s ease, color .12s ease;
  }
  nav.sidebar button:hover{background:rgba(255,255,255,.06);color:#fff;}
  nav.sidebar button.active{background:var(--navy-700);color:#fff;font-weight:600;}
  nav.sidebar svg{flex-shrink:0;}

  main{
    flex:1;min-width:0;
    padding:30px 36px 60px;
    overflow-y:auto;
  }
  .eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);margin:0 0 4px;}
  .pagetitle{font-size:30px;margin:0 0 8px;color:var(--navy-900);}
  .lede{color:var(--ink-soft);font-size:14.5px;max-width:640px;line-height:1.5;margin:0 0 26px;}

  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:22px 24px;
  }
  .grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:24px;}
  .stat .stat-label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);}
  .stat .stat-num{font-size:38px;font-weight:700;color:var(--navy-900);margin-top:4px;font-family:Georgia,serif;}

  .autogrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .autocard{
    display:flex;gap:14px;align-items:flex-start;
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:18px;cursor:pointer;text-align:left;width:100%;
    transition:border-color .12s ease, transform .12s ease;
  }
  .autocard:hover{border-color:var(--navy-700);transform:translateY(-1px);}
  .autocard .ic{
    width:38px;height:38px;border-radius:50%;background:var(--navy-800);color:#fff;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .autocard strong{display:block;font-size:14.5px;color:var(--navy-900);margin-bottom:3px;}
  .autocard span{font-size:13px;color:var(--ink-soft);line-height:1.4;}

  label{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:6px;}
  input[type=text],input[type=date],select,textarea{
    width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;
    background:#fff;font-size:14px;color:var(--ink);font-family:inherit;
  }
  input:focus,select:focus,textarea:focus,button:focus-visible{
    outline:2px solid var(--navy-700);outline-offset:1px;
  }
  .field{margin-bottom:18px;}
  .btn{
    display:inline-flex;align-items:center;gap:8px;
    background:var(--navy-800);color:#fff;border:none;
    padding:11px 18px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;
  }
  .btn:hover{background:var(--navy-700);}
  .btn.secondary{background:#fff;color:var(--navy-800);border:1px solid var(--navy-800);}
  .btn.secondary:hover{background:var(--cream-2);}
  .btn.small{padding:9px 13px;font-size:13px;white-space:nowrap;}
  .btn.danger{background:#fff;color:var(--danger);border:1px solid var(--danger);}
  .btn.danger:hover{background:#fbeeee;}

  .subhead{font-size:13px;font-weight:700;color:var(--navy-900);margin:0 0 2px;}
  .sub-sub{font-size:12.5px;color:var(--ink-soft);margin:0 0 10px;}
  .pick-row{display:flex;gap:8px;}
  .pick-row select{flex:1;}
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:22px;}

  table{width:100%;border-collapse:collapse;margin-top:4px;}
  th{
    text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--ink-soft);padding:10px 8px;border-bottom:1px solid var(--line);
  }
  td{padding:13px 8px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:top;}
  tr:last-child td{border-bottom:none;}
  .name-cell{font-weight:600;color:var(--navy-900);}
  .badge{
    display:inline-block;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;
    padding:2px 8px;border-radius:20px;margin-left:8px;font-weight:700;
  }
  .badge.on{background:#e4f2ea;color:var(--ok);}
  .badge.off{background:#f2e6e6;color:var(--danger);}
  .badge.tipo-cargo{background:#e6edf6;color:var(--navy-800);}
  .badge.tipo-area{background:#f3ece0;color:var(--gold);}
  .tag{
    display:inline-block;background:var(--cream-2);border:1px solid var(--line);
    padding:3px 9px;border-radius:20px;font-size:12.5px;margin:2px 4px 2px 0;color:var(--navy-900);
  }
  .empty{color:var(--ink-soft);font-size:13.5px;padding:20px 4px;}
  .flex-between{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;}
  .muted{color:var(--ink-soft);font-size:13px;}
  .toast{
    position:fixed;bottom:22px;right:22px;background:var(--navy-900);color:#fff;
    padding:12px 18px;border-radius:8px;font-size:13.5px;box-shadow:0 8px 24px rgba(0,0,0,.2);
    opacity:0;transform:translateY(8px);transition:opacity .18s ease, transform .18s ease;pointer-events:none;z-index:50;
  }
  .toast.show{opacity:1;transform:translateY(0);}
  .criterio-row{display:grid;grid-template-columns:1fr 120px;gap:14px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);}
  .criterio-row:last-of-type{border-bottom:none;}
  .avg-box{
    background:var(--navy-900);color:#fff;border-radius:10px;padding:18px 22px;
    display:flex;align-items:center;justify-content:space-between;margin-top:18px;
  }
  .avg-box .n{font-size:32px;font-weight:700;font-family:Georgia,serif;}
  .listcol{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px;align-items:start;}
  .chip-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;min-height:20px;}
  .chip{
    display:flex;align-items:center;gap:8px;background:var(--cream-2);border:1px solid var(--line);
    padding:6px 6px 6px 12px;border-radius:20px;font-size:13px;
  }
  .chip button{all:unset;cursor:pointer;color:var(--danger);font-weight:700;padding:2px 6px;}
  .macro-note{font-size:13px;color:var(--ink-soft);background:var(--cream-2);border-radius:8px;padding:10px 14px;margin-top:14px;}
  select#fichaSelect{max-width:360px;}
  @media (max-width:900px){
    .shell{flex-direction:column;}
    nav.sidebar{width:100%;flex-direction:row;overflow-x:auto;}
    .grid-3,.autogrid,.listcol,.two-col{grid-template-columns:1fr;}
    main{padding:22px 16px 50px;}
  }
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="crest">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><path d="M12 2 4 5v6c0 5 3.4 8.7 8 9 4.6-.3 8-4 8-9V5l-8-3Z"/></svg>
    </div>
    <div>
      <h1 id="appTitle">Panama Metro Roleplay</h1>
      <p id="appSubtitle">Dirección de Administración</p>
    </div>
  </header>

  <div class="shell">
    <nav class="sidebar" id="sidebar"></nav>
    <main id="main"></main>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const ICONS = {
  home:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9"/></svg>',
  users:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3.2"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><circle cx="17.5" cy="9" r="2.6"/><path d="M15.8 14.2c2.7.4 4.7 2.4 4.7 5.3"/></svg>',
  folder:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5H9l2 2.5h8A1.5 1.5 0 0 1 20.5 9v9A1.5 1.5 0 0 1 19 19.5H4.5A1.5 1.5 0 0 1 3 18Z"/></svg>',
  clipboard:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="6" y="4.5" width="12" height="16" rx="1.6"/><rect x="9" y="2.5" width="6" height="3.5" rx="1"/><path d="M9 11h6M9 14.5h6M9 18h4"/></svg>',
  userplus:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3.4"/><path d="M2.5 20c0-3.7 2.9-6.2 6.5-6.2s6.5 2.5 6.5 6.2"/><path d="M18.5 8.5v5M16 11h5"/></svg>',
  history:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/><path d="M12 8v4.3l3 2"/></svg>',
  roles:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h11M4 12h7M4 18h11"/><path d="M18 4.5v6M15 7.5h6"/><path d="M18 14.5v6M15 17.5h6"/></svg>',
  list:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6h.01M4 12h.01M4 18h.01"/></svg>',
  shield:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2 4 5v6c0 5 3.4 8.7 8 9 4.6-.3 8-4 8-9V5l-8-3Z"/></svg>',
  plus:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 4v16M4 12h16"/></svg>'
};

let admins = [];        // {id, nombre, cargos:[string], areas:[string], activo, fechaAlta}
let roleHistory = [];   // {id, adminId, fecha, accion, tipo:'cargo'|'area', valor}
let evaluations = [];
const CARGOS_FIJOS = ['Jefe de Administración','Supervisor de Administración','Administrador','Administrador en Pruebas'];
const CRITERIOS_DEFAULT = [
  'Conocimiento de normativa',
  'Trato con la comunidad',
  'Tiempo de respuesta',
  'Manejo de reportes',
  'Trabajo en equipo',
  'Uso correcto de comandos',
  'Actitud y compromiso'
];
const ESCALA_DEFAULT = ['Deficiente','Regular','Bueno','Excelente'];
const APP_TITLE_DEFAULT = 'Panama Metro Roleplay';
const APP_SUBTITLE_DEFAULT = 'Dirección de Administración';
let config = { cargos: [...CARGOS_FIJOS],
               areas: ['Whitelist','Manejo de Roles','Moderación General','Facción Ilegal','Soporte','Eventos'],
               criterios: [...CRITERIOS_DEFAULT],
               escala: [...ESCALA_DEFAULT],
               appTitle: APP_TITLE_DEFAULT,
               appSubtitle: APP_SUBTITLE_DEFAULT };

let route = 'inicio';
let fichaSelectedId = null;

async function loadAll(){
  try{
    const r = await window.storage.get('pmr:admins', true);
    admins = r ? JSON.parse(r.value) : [];
    // migrate older format where each admin had roles:[{cargo,area}] instead of cargos[]/areas[]
    admins = admins.map(a=>{
      if(!Array.isArray(a.cargos) || !Array.isArray(a.areas)){
        const roles = Array.isArray(a.roles) ? a.roles : [];
        return { ...a, cargos:[...new Set(roles.map(r=>r.cargo).filter(Boolean))], areas:[...new Set(roles.map(r=>r.area).filter(Boolean))] };
      }
      return a;
    });
  }catch(e){ admins = []; }
  try{ const r = await window.storage.get('pmr:roleHistory', true); roleHistory = r ? JSON.parse(r.value) : []; }catch(e){ roleHistory = []; }
  try{ const r = await window.storage.get('pmr:evaluations', true); evaluations = r ? JSON.parse(r.value) : []; }catch(e){ evaluations = []; }
  try{ const r = await window.storage.get('pmr:config', true); config = r ? JSON.parse(r.value) : config; }catch(e){ /* keep defaults */ }
  // rellena con valores por defecto solo si el config guardado no trae la lista (compatibilidad con datos viejos)
  if(!Array.isArray(config.cargos) || config.cargos.length===0) config.cargos = [...CARGOS_FIJOS];
  if(!Array.isArray(config.areas)) config.areas = [];
  if(!Array.isArray(config.criterios) || config.criterios.length===0) config.criterios = [...CRITERIOS_DEFAULT];
  if(!Array.isArray(config.escala) || config.escala.length===0) config.escala = [...ESCALA_DEFAULT];
  if(typeof config.appTitle !== 'string' || !config.appTitle.trim()) config.appTitle = APP_TITLE_DEFAULT;
  if(typeof config.appSubtitle !== 'string') config.appSubtitle = APP_SUBTITLE_DEFAULT;
  await saveConfig();
}
async function saveAdmins(){ try{ await window.storage.set('pmr:admins', JSON.stringify(admins), true); }catch(e){ console.error(e); } }
async function saveRoleHistory(){ try{ await window.storage.set('pmr:roleHistory', JSON.stringify(roleHistory), true); }catch(e){ console.error(e); } }
async function saveEvaluations(){ try{ await window.storage.set('pmr:evaluations', JSON.stringify(evaluations), true); }catch(e){ console.error(e); } }
async function saveConfig(){ try{ await window.storage.set('pmr:config', JSON.stringify(config), true); }catch(e){ console.error(e); } }

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function fmtDate(iso){ const d = new Date(iso+'T00:00:00'); return d.toLocaleDateString('es-PA',{day:'2-digit',month:'short',year:'numeric'}); }
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=>t.classList.remove('show'), 2400);
}
function optionsHtml(arr, selected){
  return arr.map(v=>`<option value="${escAttr(v)}" ${v===selected?'selected':''}>${esc(v)}</option>`).join('');
}
function esc(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escAttr(s){ return esc(s); }

const NAV = [
  {id:'inicio', label:'Inicio', icon:'home'},
  {id:'administradores', label:'Administradores', icon:'users'},
  {id:'ficha', label:'Ficha', icon:'folder'},
  {id:'nuevaEval', label:'Nueva evaluación', icon:'clipboard'},
  {id:'nuevoRol', label:'Nuevo rol', icon:'userplus'},
  {id:'historialEval', label:'Historial eval.', icon:'history'},
  {id:'historialRoles', label:'Historial roles', icon:'roles'},
  {id:'listas', label:'Listas', icon:'list'},
  {id:'macros', label:'Macros VBA', icon:'shield'},
];

function renderSidebar(){
  const el = document.getElementById('sidebar');
  el.innerHTML = NAV.map(n=>`
    <button data-route="${n.id}" class="${route===n.id?'active':''}">
      ${ICONS[n.icon]}<span>${n.label}</span>
    </button>`).join('');
  el.querySelectorAll('button').forEach(b=>{
    b.addEventListener('click', ()=>{ route = b.dataset.route; render(); });
  });
}

function go(r){ route = r; render(); }

function render(){
  const t = document.getElementById('appTitle'); if(t) t.textContent = config.appTitle;
  const s = document.getElementById('appSubtitle'); if(s) s.textContent = config.appSubtitle;
  renderSidebar();
  const main = document.getElementById('main');
  if(route==='inicio') main.innerHTML = viewInicio();
  else if(route==='administradores') main.innerHTML = viewAdministradores();
  else if(route==='ficha') main.innerHTML = viewFicha();
  else if(route==='nuevaEval') main.innerHTML = viewNuevaEval();
  else if(route==='nuevoRol') main.innerHTML = viewNuevoRol();
  else if(route==='historialEval') main.innerHTML = viewHistorialEval();
  else if(route==='historialRoles') main.innerHTML = viewHistorialRoles();
  else if(route==='listas') main.innerHTML = viewListas();
  else if(route==='macros') main.innerHTML = viewMacros();
  bindRouteEvents();
}

function viewInicio(){
  return `
    <p class="eyebrow">Panel principal</p>
    <h2 class="pagetitle">Sistema de administradores</h2>
    <p class="lede">Las macros ya no se copian a mano: guardar un rol, una evaluación o un administrador escribe directo en el historial, calcula el puntaje y actualiza la ficha.</p>

    <div class="grid-3">
      <div class="card stat"><div class="stat-label">Administradores</div><div class="stat-num">${admins.length}</div></div>
      <div class="card stat"><div class="stat-label">Evaluaciones</div><div class="stat-num">${evaluations.length}</div></div>
      <div class="card stat"><div class="stat-label">Cambios de rol</div><div class="stat-num">${roleHistory.length}</div></div>
    </div>

    <div class="card">
      <h3 style="margin:0 0 4px;color:var(--navy-900);">Automatización</h3>
      <p class="muted" style="margin:0 0 16px;">Equivalente a los botones VBA del archivo original.</p>
      <div class="autogrid">
        <button class="autocard" data-go="administradores">
          <div class="ic">${ICONS.userplus}</div>
          <div><strong>Agregar administrador</strong><span>Nombre, cargos y áreas por separado. Agrega solo lo que necesite, sin límite.</span></div>
        </button>
        <button class="autocard" data-go="nuevoRol">
          <div class="ic">${ICONS.roles}</div>
          <div><strong>Guardar rol</strong><span>Añade un cargo, un área, o varios de cada uno, de forma independiente.</span></div>
        </button>
        <button class="autocard" data-go="nuevaEval">
          <div class="ic">${ICONS.clipboard}</div>
          <div><strong>Guardar evaluación</strong><span>Califica 7 criterios. El promedio 1–4 se calcula solo.</span></div>
        </button>
        <button class="autocard" data-go="ficha">
          <div class="ic">${ICONS.folder}</div>
          <div><strong>Consultar ficha</strong><span>Resumen, historial de roles y evaluaciones del administrador elegido.</span></div>
        </button>
      </div>
    </div>
  `;
}

function chipPickerHtml(sectionKey, title, hint, optionsArr, currentList){
  const list = currentList;
  return `
    <div class="field" data-chip-section="${sectionKey}">
      <p class="subhead">${title}</p>
      <p class="sub-sub">${hint}</p>
      <div class="pick-row">
        <select data-chip-select="${sectionKey}">${optionsHtml(optionsArr, optionsArr[0])}</select>
        <button class="btn small" type="button" data-chip-add="${sectionKey}">${ICONS.plus} Añadir</button>
      </div>
      <div class="chip-list">
        ${list.length===0 ? `<span class="muted">Nada agregado todavía — puedes dejarlo así.</span>` :
          list.map((v,i)=>`<span class="chip">${esc(v)}<button data-chip-remove="${sectionKey}:${i}">✕</button></span>`).join('')}
      </div>
    </div>`;
}

const EDITABLE_LISTS = {
  newAdminCargos: { add:v=>{ if(!newAdminCargos.includes(v)) newAdminCargos.push(v); }, rm:i=>newAdminCargos.splice(i,1) },
  newAdminAreas:  { add:v=>{ if(!newAdminAreas.includes(v)) newAdminAreas.push(v); },  rm:i=>newAdminAreas.splice(i,1) },
  newRoleCargos:  { add:v=>{ if(!newRoleCargos.includes(v)) newRoleCargos.push(v); },  rm:i=>newRoleCargos.splice(i,1) },
  newRoleAreas:   { add:v=>{ if(!newRoleAreas.includes(v)) newRoleAreas.push(v); },   rm:i=>newRoleAreas.splice(i,1) },
};

function bindChipPickers(){
  document.querySelectorAll('[data-chip-add]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const key = btn.dataset.chipAdd;
      const sel = document.querySelector(`[data-chip-select="${key}"]`);
      if(sel && sel.value) EDITABLE_LISTS[key].add(sel.value);
      render();
    });
  });
  document.querySelectorAll('[data-chip-remove]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const [key, idx] = btn.dataset.chipRemove.split(':');

let evalCriteria = [...CRITERIOS_DEFAULT.map(()=>2)];
let evalAdminId = null;

function viewNuevaEval(){
  if(!evalAdminId && admins.length) evalAdminId = admins[0].id;
  const maxEscala = config.escala.length;
  // si la lista de criterios cambió (se agregó o quitó alguno en "Listas"), realinea las calificaciones conservando lo ya elegido
  if(evalCriteria.length !== config.criterios.length){
    evalCriteria = config.criterios.map((_,i)=> evalCriteria[i] ?? Math.min(2, maxEscala));
  }
  // si la escala cambió de tamaño, ajusta calificaciones que hayan quedado fuera de rango
  evalCriteria = evalCriteria.map(v=> Math.max(1, Math.min(v, maxEscala)));
  const avg = evalCriteria.reduce((a,b)=>a+b,0) / evalCriteria.length;
  return `
    <p class="eyebrow">Evaluación de desempeño</p>
    <h2 class="pagetitle">Nueva evaluación</h2>
    ${admins.length===0 ? `<div class="card"><p class="empty">Agrega un administrador antes de evaluar.</p></div>` : `
    <div class="card">
      <div class="field">
        <label>Administrador</label>

          ${admins.map(a=>`<option value="${a.id}" ${a.id===evalAdminId?'selected':''}>${esc(a.nombre)}</option>`).join('')}
        </select>
      </div>

      <div class="field">
        <label>Fecha</label>
        <input type="date" id="evalDate" value="${todayISO()}">
      </div>

      <div>
        ${config.criterios.map((c,i)=>`
          <div class="criterio-row">
            <span>${c}</span>
            <select data-crit-idx="${i}">
              ${config.escala.map((etq,j)=>`<option value="${j+1}" ${evalCriteria[i]==j+1?'selected':''}>${j+1} — ${esc(etq)}</option>`).join('')}
            </select>
          </div>`).join('')}
      </div>

      <div class="avg-box">
        <span>Promedio (1–${maxEscala})</span>
        <span class="n">${avg.toFixed(2)}</span>
      </div>

      <div style="margin-top:18px;">
        <button class="btn" id="saveEvalBtn">Guardar evaluación</button>
      </div>
    </div>`}
  `;
}

function bindRouteEvents(){
  document.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click', ()=>go(b.dataset.go)));

  if(route==='administradores'){
    bindChipPickers();
    document.getElementById('saveAdminBtn')?.addEventListener('click', async ()=>{
      const nameInput = document.getElementById('newAdminName');
      const name = nameInput.value.trim();
      if(!name){ toast('Escribe un nombre para el administrador.'); nameInput.focus(); return; }
      const admin = { id: uid(), nombre: name, cargos: [...newAdminCargos], areas: [...newAdminAreas], activo: true, fechaAlta: todayISO() };
      admins.push(admin);
      newAdminCargos.forEach(c=>roleHistory.push({ id: uid(), adminId: admin.id, fecha: todayISO(), accion:'Alta inicial', tipo:'cargo', valor:c }));
      newAdminAreas.forEach(a=>roleHistory.push({ id: uid(), adminId: admin.id, fecha: todayISO(), accion:'Alta inicial', tipo:'area', valor:a }));
      await saveAdmins(); await saveRoleHistory();
      newAdminCargos = []; newAdminAreas = [];
      toast(`${name} fue agregado (${admin.cargos.length} cargo(s), ${admin.areas.length} área(s)).`);
      render();
    });
    document.querySelectorAll('[data-toggle-active]').forEach(b=>{
      b.addEventListener('click', async ()=>{
        const a = admins.find(x=>x.id===b.dataset.toggleActive);
        a.activo = !a.activo;
        await saveAdmins();
        render();
      });
    });
    document.querySelectorAll('[data-view-ficha]').forEach(b=>{
      b.addEventListener('click', ()=>{ fichaSelectedId = b.dataset.viewFicha; go('ficha'); });
    });
  }

  if(route==='ficha'){
    document.getElementById('fichaSelect')?.addEventListener('change', (e)=>{
      fichaSelectedId = e.target.value; render();
    });
  }

  if(route==='nuevaEval'){
    document.getElementById('evalAdminSelect')?.addEventListener('change', (e)=>{ evalAdminId = e.target.value; });
    document.querySelectorAll('[data-crit-idx]').forEach(sel=>{
      sel.addEventListener('change', ()=>{
        evalCriteria[parseInt(sel.dataset.critIdx,10)] = parseInt(sel.value,10);
        render();
      });
    });
    document.getElementById('saveEvalBtn')?.addEventListener('click', async ()=>{
      const date = document.getElementById('evalDate').value || todayISO();
      const avg = evalCriteria.reduce((a,b)=>a+b,0) / evalCriteria.length;
      evaluations.push({ id: uid(), adminId: evalAdminId, fecha: date, criterios: [...evalCriteria], criteriosLabels: [...config.criterios], escalaMax: config.escala.length, promedio: avg });
      await saveEvaluations();
      const admin = admins.find(a=>a.id===evalAdminId);
      toast(`Evaluación guardada para ${admin?admin.nombre:''} — promedio ${avg.toFixed(2)}.`);
      evalCriteria = config.criterios.map(()=>Math.min(2, config.escala.length));
      render();
    });
  }

  if(route==='nuevoRol'){
    bindChipPickers();
    document.getElementById('roleAdminSelect')?.addEventListener('change', (e)=>{ newRoleAdminId = e.target.value; });

    async function commitNewRole(mode){
      const admin = admins.find(a=>a.id===newRoleAdminId);
      if(!admin){ toast('Selecciona un administrador.'); return; }
      if(newRoleCargos.length===0 && newRoleAreas.length===0){ toast('Añade al menos un cargo o un área.'); return; }

      if(mode==='replace'){
        if(newRoleCargos.length) admin.cargos = [...newRoleCargos];
        if(newRoleAreas.length) admin.areas = [...newRoleAreas];
      } else {
        newRoleCargos.forEach(c=>{ if(!admin.cargos.includes(c)) admin.cargos.push(c); });
        newRoleAreas.forEach(a=>{ if(!admin.areas.includes(a)) admin.areas.push(a); });
      }

      const accion = mode==='replace' ? 'Reemplazo' : 'Añadido';
      newRoleCargos.forEach(c=>roleHistory.push({ id: uid(), adminId: admin.id, fecha: todayISO(), accion, tipo:'cargo', valor:c }));
      newRoleAreas.forEach(a=>roleHistory.push({ id: uid(), adminId: admin.id, fecha: todayISO(), accion, tipo:'area', valor:a }));

      await saveAdmins(); await saveRoleHistory();
      newRoleCargos = []; newRoleAreas = [];
      toast(`Roles actualizados para ${admin.nombre}.`);
      render();
    }
    document.getElementById('addToRolesBtn')?.addEventListener('click', ()=>commitNewRole('add'));
    document.getElementById('replaceRolesBtn')?.addEventListener('click', ()=>commitNewRole('replace'));
  }

  if(route==='listas'){
    document.getElementById('addCargoBtn')?.addEventListener('click', async ()=>{
      const inp = document.getElementById('newCargoInput');
      const v = inp.value.trim();
      if(!v) return;
      if(!config.cargos.includes(v)) config.cargos.push(v);
      await saveConfig();
      render();
    });
    document.querySelectorAll('[data-del-cargo]').forEach(b=>{
      b.addEventListener('click', async ()=>{
        config.cargos = config.cargos.filter(c=>c!==b.dataset.delCargo);
        await saveConfig(); render();
      });
    });

    document.getElementById('addAreaBtn')?.addEventListener('click', async ()=>{
      const inp = document.getElementById('newAreaInput');
      const v = inp.value.trim();
      if(!v) return;
      if(!config.areas.includes(v)) config.areas.push(v);
      await saveConfig();
      render();
    });
    document.querySelectorAll('[data-del-area]').forEach(b=>{
      b.addEventListener('click', async ()=>{
        config.areas = config.areas.filter(a=>a!==b.dataset.delArea);
        await saveConfig(); render();
      });
    });

    document.getElementById('addCriterioBtn')?.addEventListener('click', async ()=>{
      const inp = document.getElementById('newCriterioInput');
      const v = inp.value.trim();
      if(!v) return;
      if(!config.criterios.includes(v)) config.criterios.push(v);
      await saveConfig();
      render();
    });
    document.querySelectorAll('[data-del-criterio]').forEach(b=>{
      b.addEventListener('click', async ()=>{
        config.criterios = config.criterios.filter(c=>c!==b.dataset.delCriterio);
        await saveConfig(); render();
      });
    });

    document.getElementById('addEscalaBtn')?.addEventListener('click', async ()=>{
      const inp = document.getElementById('newEscalaInput');
      const v = inp.value.trim();
      if(!v) return;
      if(!config.escala.includes(v)) config.escala.push(v);
      await saveConfig();
      render();
    });
    document.querySelectorAll('[data-del-escala]').forEach(b=>{
      b.addEventListener('click', async ()=>{
        config.escala = config.escala.filter(e=>e!==b.dataset.delEscala);
        await saveConfig(); render();
      });
    });

    document.getElementById('saveGeneralBtn')?.addEventListener('click', async ()=>{
      const titleInp = document.getElementById('appTitleInput');
      const subInp = document.getElementById('appSubtitleInput');
      const title = titleInp.value.trim();
      if(!title){ toast('El nombre del servidor no puede quedar vacío.'); titleInp.focus(); return; }
      config.appTitle = title;
      config.appSubtitle = subInp.value.trim();
      await saveConfig();
      toast('Datos generales actualizados.');
      render();
    });
  }
}

(async function init(){
  document.getElementById('main').innerHTML = '<p class="muted">Cargando…</p>';
  await loadAll();
  render();
})();
</script>
</body>
</html>
